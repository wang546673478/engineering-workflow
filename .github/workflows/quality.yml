name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA whose protected-rule changes were reviewed
        required: true
        type: string
      task_id:
        description: Task recorded in the reviewed manifest
        required: true
        default: TASK-SELF-01
        type: string

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check submitted rules before running declared tests
        run: python scripts/check_project.py --root . --manifest engineering-manifest.json --mode committed --commit-ref HEAD --task TASK-SELF-01 --run-checks

  reviewed-rules:
    if: github.event_name == 'workflow_dispatch'
    environment: engineering-control-review
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require the exact reviewed commit
        env:
          REVIEWED_SHA: ${{ inputs.commit_sha }}
        run: >-
          python -c "import os,re,subprocess; value=os.environ['REVIEWED_SHA'];
          assert re.fullmatch(r'[a-fA-F0-9]{40}|[a-fA-F0-9]{64}',value), 'Use a full commit SHA';
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip().lower()==value.lower(), 'Checkout differs from reviewed commit'"
      - name: Verify human-reviewed rules and run checks
        env:
          ENGINEERING_TASK_ID: ${{ inputs.task_id }}
          ENGINEERING_CONTROL_PLANE_APPROVED: ${{ vars.ENGINEERING_CONTROL_PLANE_APPROVED }}
        run: >-
          python -c "import pathlib,subprocess,sys; pathlib.Path('work').mkdir(exist_ok=True);
          sys.exit(subprocess.call([sys.executable,'scripts/check_project.py','--root','.','--manifest','engineering-manifest.json','--mode','committed','--commit-ref','HEAD','--allow-control-plane-change','--run-checks','--report','work/ci-review.json']))"
      - name: Diagnose a test failure after successful rule validation
        if: failure()
        run: >-
          python -c "import json,pathlib,subprocess,sys;
          data=json.loads(pathlib.Path('work/ci-review.json').read_text(encoding='utf-8'));
          checks={c['rule_id']:c for c in data['checks']};
          assert not data['errors'] and checks.get('control-plane',{}).get('status')=='pass' and checks.get('committed-scope',{}).get('status')=='pass', 'Rule validation did not pass; diagnostic commands will not run';
          assert all(c['status']=='pass' for c in data['checks'] if c['required'] and c['rule_id'] not in ('TEST','COMPILE')), 'A required gate did not pass';
          assert checks.get('TEST',{}).get('status')=='fail', 'No executed test failure to diagnose';
          sys.exit(subprocess.call([sys.executable,'-m','unittest','discover','-s','scripts/tests','-v']))"
